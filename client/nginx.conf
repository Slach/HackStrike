server {
    listen 9999;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket passthrough to the Go server. This keeps a single origin:
    # through zrok only port 9999 is shared, and the browser connects to
    # wss://<zrok-host>/ws without knowing about the game server at all.
    location /ws {
        proxy_pass http://game-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Keep idle tunnels open; the client pings every 5s anyway.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://game-server:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
