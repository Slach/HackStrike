server {
    listen 9999;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket passthrough to the Go server. This keeps a single origin:
    # through zrok only port 9999 is shared, and the browser connects to
    # wss://<zrok-host>/ws without knowing about the game server at all.
    location /ws {
        proxy_pass http://game-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host keeps the port ($host drops it); coder/websocket
        # compares the browser's Origin against Host, so a portless Host
        # gets same-origin upgrades rejected with 403.
        proxy_set_header Host $http_host;
        # Keep idle tunnels open; the client pings every 5s anyway.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Game HTTP API (e.g. GET /api/map — the map is data served by the Go
    # server, the client never hardcodes level geometry).
    location /api {
        proxy_pass http://game-server:8080;
    }

    location /healthz {
        proxy_pass http://game-server:8080;
    }

    # index.html — always revalidated (it references hashed assets);
    # hashed /assets/* are immutable and cacheable forever.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
