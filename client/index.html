<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- PWA standalone на iOS: до 16.4 понимает только legacy-тег (modern
         display-mode: standalone работает лишь с 16.4) — без него ярлык с
         домашнего экрана открывается закладкой в Safari (ГДД §15.4) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HACKSTRIKE" />
    <title>HACKSTRIKE</title>
    <style>
      :root {
        color-scheme: dark;
        --cy: #37ff9b;
        --mg: #ff4dd2;
        --ink: #eafff3;
        --panel: rgba(2, 14, 8, 0.88);
        --line: rgba(55, 255, 155, 0.32);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050a06;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--cy);
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      .hidden {
        display: none !important;
      }
      .t0 {
        color: var(--cy);
      }
      .t1 {
        color: var(--mg);
      }

      /* debug corner (from the skeleton) */
      #debug {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.7;
        min-width: 210px;
        pointer-events: none;
        text-shadow: 0 0 8px rgba(0, 255, 128, 0.4);
        z-index: 5;
      }
      #debug h1 {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 3px;
        font-weight: 700;
        color: #baffdd;
        border-bottom: 1px solid rgba(0, 255, 128, 0.25);
        padding-bottom: 6px;
      }
      #debug .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      #debug .dim {
        color: rgba(55, 255, 155, 0.55);
      }
      .status-open {
        color: #37ff9b;
      }
      .status-connecting {
        color: #ffd237;
      }
      .status-closed {
        color: #ff4d5e;
      }

      /* team score + match timer */
      #topbar {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 8px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        pointer-events: none;
        z-index: 5;
      }
      #score0,
      #score1 {
        font-size: 22px;
        font-weight: 700;
        text-shadow: 0 0 10px currentColor;
        min-width: 34px;
        text-align: center;
      }
      #timer {
        font-size: 15px;
        color: var(--ink);
        min-width: 56px;
        text-align: center;
        letter-spacing: 2px;
      }
      /* Own team's frags: white on a solid team-color chip, larger. */
      #score0.mine,
      #score1.mine {
        color: #fff;
        font-size: 28px;
        padding: 2px 12px;
        border-radius: 4px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
      }
      #score0.mine {
        background: var(--cy);
      }
      #score1.mine {
        background: var(--mg);
      }
      .tcol {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .roster {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        font-size: 11px;
        letter-spacing: 1px;
        line-height: 1.25;
      }
      .roster.t0 {
        color: var(--cy);
      }
      .roster.t1 {
        color: var(--mg);
      }
      .roster .dead {
        opacity: 0.45;
      }
      .roster .me {
        font-weight: 700;
      }

      /* HP + class */
      #vitals {
        position: absolute;
        left: 16px;
        bottom: 16px;
        width: 250px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        pointer-events: none;
        z-index: 5;
      }
      #weaponTag {
        font-size: 11px;
        letter-spacing: 2px;
        color: #ffd237;
        margin: 0 8px;
      }
      #weaponTag:empty {
        display: none;
      }
      #clsLabelRow {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        letter-spacing: 2px;
        color: #baffdd;
        margin-bottom: 7px;
      }
      #hpNum {
        color: var(--ink);
      }
      #hpbar {
        height: 10px;
        background: rgba(55, 255, 155, 0.1);
        border: 1px solid rgba(55, 255, 155, 0.35);
        border-radius: 3px;
        overflow: hidden;
      }
      #hpfill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #0fe37e, #37ff9b);
        box-shadow: 0 0 8px rgba(55, 255, 155, 0.6);
        transition: width 0.15s;
      }
      #hpfill.low {
        background: #ff4d5e;
        box-shadow: 0 0 8px rgba(255, 77, 94, 0.7);
      }

      /* crosshair dot */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 0 0 7px rgba(55, 255, 155, 0.95);
        pointer-events: none;
        z-index: 5;
      }
      #crosshair.locked {
        background: var(--mg);
        box-shadow: 0 0 11px rgba(255, 77, 210, 0.95);
      }

      /* prop hover label (under the crosshair) */
      #propLabel {
        position: absolute;
        top: calc(50% + 26px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 2px;
        color: rgba(186, 255, 221, 0.85);
        text-shadow: 0 0 6px rgba(55, 255, 155, 0.5);
        pointer-events: none;
        z-index: 5;
        white-space: nowrap;
      }
      #propLabel:empty {
        display: none;
      }

      /* sniper scope overlay (auto-zoom) */
      #scope {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }
      #scope .ring {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(1, 9, 5, 0.9) 32%);
      }
      #scope .h {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(55, 255, 155, 0.45);
      }
      #scope .v {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(55, 255, 155, 0.45);
      }

      /* hitmarker: white X burst when my shot lands */
      #hitmarker {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        background:
          linear-gradient(45deg, transparent 42%, #fff 42% 58%, transparent 58%),
          linear-gradient(-45deg, transparent 42%, #fff 42% 58%, transparent 58%);
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
      #hitmarker.on {
        animation: hitPop 0.18s ease-out;
      }
      @keyframes hitPop {
        0% {
          opacity: 1;
          transform: scale(1.3);
        }
        100% {
          opacity: 0;
          transform: scale(0.75);
        }
      }

      /* damage vignette: local player lost HP */
      #dmg {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 140px 40px rgba(255, 45, 70, 0.5);
        opacity: 0;
        pointer-events: none;
        z-index: 4;
      }
      #dmg.on {
        animation: dmgFlash 0.5s ease-out;
      }
      @keyframes dmgFlash {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /* killfeed */
      #killfeed {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-end;
        pointer-events: none;
        z-index: 5;
        max-width: 42%;
      }
      .kf {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 12px;
        letter-spacing: 1px;
        opacity: 1;
        transition: opacity 0.7s;
      }
      .kf.fade {
        opacity: 0;
      }
      .kf .arrow {
        color: #baffdd;
        margin: 0 6px;
      }
      /* сработал watcher: хакер не в деке — уведомление в киллфид (M3 §13.3) */
      .kf.watcher {
        color: #ffcf6b;
        border-color: rgba(255, 159, 67, 0.45);
        text-shadow: 0 0 8px rgba(255, 159, 67, 0.5);
      }

      /* minimap */
      #minimap {
        position: absolute;
        right: 16px;
        bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(2, 10, 6, 0.85);
        pointer-events: none;
        z-index: 5;
      }

      /* full-screen overlays */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        /* flex-start + margin:auto на .panel: центр пока влезает, при переполнении
           доступ сверху не режется (иначе ДЕПЛОЙ недостижим на узких экранах) */
        align-items: flex-start;
        justify-content: center;
        overflow: auto;
        background: rgba(2, 7, 4, 0.8);
        z-index: 10;
      }
      #deathOverlay {
        background: rgba(46, 3, 22, 0.55);
        z-index: 11;
      }
      #endOverlay {
        z-index: 12;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 26px 34px;
        text-align: center;
        box-shadow: 0 0 50px rgba(0, 255, 128, 0.14);
        /* в ландшафте телефона (вьюпорт ~844) 860 распирали бы панель —
           clamp к ширине оверлея, горизонтального клиппинга карточек нет (§15.4) */
        max-width: min(860px, 100%);
        margin: auto; /* авто-центрирование по обеим осям в overflow-контейнере */
      }
      .logo {
        margin: 0;
        font-size: 42px;
        letter-spacing: 14px;
        color: var(--ink);
        text-shadow: 0 0 20px rgba(55, 255, 155, 0.8);
      }
      .tag {
        font-size: 11px;
        letter-spacing: 5px;
        color: rgba(55, 255, 155, 0.6);
        margin: 8px 0 22px;
      }
      .joinRow {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .joinRow label {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(55, 255, 155, 0.7);
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 11px;
        letter-spacing: 2px;
        color: rgba(55, 255, 155, 0.7);
        cursor: pointer;
        user-select: none;
      }
      .chk input {
        accent-color: #37ff9b;
        width: 14px;
        height: 14px;
        cursor: pointer;
      }
      .seg {
        gap: 8px;
      }
      .segBtn {
        background: transparent;
        border: 1px solid var(--line);
        color: rgba(55, 255, 155, 0.7);
        font: inherit;
        font-size: 11px;
        letter-spacing: 2px;
        padding: 6px 14px;
        border-radius: 3px;
        cursor: pointer;
      }
      .segBtn.t0 {
        color: var(--cy);
      }
      .segBtn.t1 {
        color: var(--mg);
      }
      .segBtn.on {
        border-color: currentColor;
        box-shadow: 0 0 8px rgba(55, 255, 155, 0.25);
        background: rgba(55, 255, 155, 0.08);
      }
      #nameInput {
        background: #02120a;
        border: 1px solid var(--line);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        padding: 8px 12px;
        width: 230px;
        border-radius: 4px;
        outline: none;
        text-align: center;
        letter-spacing: 1px;
      }
      #nameInput:focus {
        border-color: var(--cy);
        box-shadow: 0 0 12px rgba(55, 255, 155, 0.25);
      }

      /* class cards (join + respawn) */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
      }
      .card {
        background: rgba(2, 18, 10, 0.92);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s, box-shadow 0.15s;
        user-select: none;
      }
      .card:hover {
        border-color: rgba(55, 255, 155, 0.85);
      }
      .card.selected {
        border-color: var(--cy);
        box-shadow: 0 0 16px rgba(55, 255, 155, 0.35);
      }
      .card-name {
        font-size: 13px;
        letter-spacing: 2px;
        color: var(--ink);
      }
      .card-weapon {
        font-size: 10px;
        color: rgba(55, 255, 155, 0.75);
        margin: 3px 0 8px;
        letter-spacing: 1px;
      }
      .card-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px 8px;
        font-size: 11px;
        color: #baffdd;
      }
      .card-note {
        margin-top: 8px;
        font-size: 10px;
        color: rgba(255, 77, 210, 0.85);
        letter-spacing: 1px;
      }

      .btn {
        background: rgba(55, 255, 155, 0.12);
        border: 1px solid var(--cy);
        color: var(--cy);
        font: inherit;
        font-size: 16px;
        letter-spacing: 5px;
        padding: 16px 56px;
        min-width: 240px;
        min-height: 56px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:hover:not(:disabled) {
        background: rgba(55, 255, 155, 0.25);
        box-shadow: 0 0 14px rgba(55, 255, 155, 0.4);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .dim {
        font-size: 11px;
        color: rgba(55, 255, 155, 0.55);
        margin-top: 14px;
        letter-spacing: 1px;
      }

      /* death overlay */
      #deathTitle {
        font-size: 26px;
        letter-spacing: 5px;
        color: #ff6d9d;
        text-shadow: 0 0 16px rgba(255, 77, 210, 0.55);
      }
      #deathCount {
        font-size: 56px;
        color: var(--ink);
        margin: 14px 0;
        text-shadow: 0 0 18px rgba(55, 255, 155, 0.5);
      }

      /* match end overlay */
      .end-title {
        font-size: 27px;
        letter-spacing: 6px;
        color: var(--ink);
      }
      .end-title.t0 {
        color: var(--cy);
        text-shadow: 0 0 16px rgba(55, 255, 155, 0.6);
      }
      .end-title.t1 {
        color: var(--mg);
        text-shadow: 0 0 16px rgba(255, 77, 210, 0.6);
      }
      #endScore {
        font-size: 42px;
        margin: 12px 0 8px;
        color: var(--ink);
      }
      #endScore .t0,
      #endScore .t1 {
        text-shadow: 0 0 12px currentColor;
      }
      #endCount {
        font-size: 22px;
        color: rgba(55, 255, 155, 0.85);
        margin-bottom: 4px;
      }

      /* jack-in hint (hacker near terminal/radio, M2) */
      #jackinHint {
        position: absolute;
        top: 42%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        font-size: 14px;
        letter-spacing: 3px;
        text-shadow: 0 0 10px rgba(55, 255, 155, 0.6);
        box-shadow: 0 0 22px rgba(55, 255, 155, 0.18);
        pointer-events: none;
        z-index: 6;
        white-space: nowrap;
      }

      /* FPS-элементы прячутся, пока хакер в деке (тело стоит, прицел не нужен) */
      body.hackmode #crosshair,
      body.hackmode #scope,
      body.hackmode #hitmarker,
      body.hackmode #dmg,
      body.hackmode #vitals,
      body.hackmode #minimap {
        display: none !important;
      }

      /* hacker view: CRT-терминал, зелёный на чёрном (ГДД §5.4/§12.6) */
      #hackview {
        position: absolute;
        inset: 0;
        z-index: 10; /* ниже death (11) и end (12) — смерть поверх деки */
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(ellipse at 50% 42%, rgba(4, 26, 14, 0.985), rgba(1, 8, 4, 0.995)),
          #020a05;
        color: #56ffa8;
        font-size: 13px;
        padding: 10px 14px 6px;
        gap: 8px;
        cursor: default;
      }
      #hackview::after {
        /* скан-линии CRT */
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0 1px,
          transparent 1px 3px
        );
      }
      #hackview .hv-main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        gap: 8px;
      }
      .hv-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        border-bottom: 1px solid rgba(55, 255, 155, 0.3);
        padding-bottom: 6px;
        flex: none;
      }
      .hv-title {
        font-size: 16px;
        letter-spacing: 6px;
        color: #eafff3;
        text-shadow: 0 0 12px rgba(55, 255, 155, 0.7);
        font-weight: 700;
      }
      .hv-host {
        color: #baffdd;
        letter-spacing: 1px;
      }
      .hv-net {
        color: #56ffa8;
        letter-spacing: 1px;
      }
      .hv-exit {
        margin-left: auto;
        color: rgba(255, 77, 210, 0.85);
        font-size: 11px;
        letter-spacing: 2px;
      }
      .hv-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        flex: none;
      }
      .hv-chip {
        background: rgba(55, 255, 155, 0.05);
        border: 1px solid rgba(55, 255, 155, 0.3);
        color: rgba(170, 255, 210, 0.8);
        font: inherit;
        font-size: 11px;
        letter-spacing: 1px;
        padding: 4px 10px;
        border-radius: 3px;
        cursor: pointer;
      }
      .hv-chip:hover {
        border-color: rgba(55, 255, 155, 0.8);
      }
      .hv-chip.on {
        border-color: #37ff9b;
        color: #eafff3;
        background: rgba(55, 255, 155, 0.12);
        box-shadow: 0 0 8px rgba(55, 255, 155, 0.25);
      }
      .hv-chip.hv-plus {
        border-style: dashed;
      }
      .hv-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        gap: 8px;
      }
      .hv-grid.g1 {
        grid-template: 1fr / 1fr;
      }
      .hv-grid.g2h {
        grid-template: 1fr / 1fr 1fr;
      }
      .hv-grid.g2v {
        grid-template: 1fr 1fr / 1fr;
      }
      .hv-grid.g4 {
        grid-template: 1fr 1fr / 1fr 1fr;
      }
      .hv-pane {
        border: 1px solid rgba(55, 255, 155, 0.22);
        border-radius: 6px;
        background: rgba(2, 16, 9, 0.72);
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
      .hv-pane.active {
        border-color: rgba(55, 255, 155, 0.85);
        box-shadow: 0 0 14px rgba(55, 255, 155, 0.22), inset 0 0 40px rgba(55, 255, 155, 0.04);
      }
      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 10px;
        border-bottom: 1px solid rgba(55, 255, 155, 0.18);
        background: rgba(55, 255, 155, 0.05);
        font-size: 11px;
        letter-spacing: 2px;
        color: #baffdd;
        flex: none;
      }
      .pane-x {
        background: none;
        border: 1px solid rgba(255, 77, 210, 0.4);
        color: #ff4dd2;
        font: inherit;
        border-radius: 3px;
        cursor: pointer;
        padding: 0 6px;
        line-height: 1.5;
      }
      .pane-body {
        flex: 1;
        min-height: 0;
        display: flex;
        padding: 10px;
        gap: 12px;
        overflow: auto;
      }
      .deck-left {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 240px;
        flex: none;
      }
      .deck-right {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hv-sparks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        flex: none;
      }
      .deck-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .deck-cols {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 12px;
      }
      .spark {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .spark-top {
        display: flex;
        justify-content: space-between;

      /* ── Мобильная адаптация (ГДД §15): оверлей meatview + touch-слой деки.
         Всё под body.touch — класс вешает mobile.ts при детекте пальца;
         на десктопе правила не применяются (нулевая регрессия). ── */
      :root {
        --kb: 0px; /* высота экранной клавиатуры: mobile.ts следит, CSS якорит палитру */
      }
      body.touch {
        /* НЕ глобальный touch-action:none: он глушил скролл join/death-оверлеев
           (§15.3). Зоны игры (canvas, tc-*, netmap) несут none точечно. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #touchui {
        position: fixed;
        inset: 0;
        z-index: 8; /* ниже hackmode-деки (10), но выше HUD (5): дека прячет оверлей собой */
        pointer-events: none; /* зоны внутри включают сами */
        display: none;
      }
      body.touch #touchui {
        display: block;
      }
      body.hackmode #touchui {
        display: none; /* в деке пальцы нужны WM (ГДД §12.1) */
      }
      /* §15.4 (ревебр owner): в ландшафте контролы в самих углах под большие
         пальцы, компактнее (112px вместо «в пол-экрана») и плотнее по фону —
         фон почти непрозрачный, рамка/глифы приглушены (не «слишком сильные») */
      .tc-pad {
        position: absolute;
        left: calc(8px + env(safe-area-inset-left));
        bottom: calc(8px + env(safe-area-inset-bottom));
        width: 112px;
        height: 112px;
        pointer-events: auto;
        touch-action: none;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(2, 18, 10, 0.78), rgba(2, 18, 10, 0.88));
        border: 1px solid rgba(55, 255, 155, 0.24);
      }
      .tc-seg {
        position: absolute;
        color: rgba(170, 255, 210, 0.5);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tc-seg.up { top: 4px; left: 0; right: 0; height: 30px; }
      .tc-seg.down { bottom: 4px; left: 0; right: 0; height: 30px; }
      .tc-seg.left { left: 4px; top: 0; bottom: 0; width: 30px; }
      .tc-seg.right { right: 4px; top: 0; bottom: 0; width: 30px; }
      .tc-seg.hot {
        color: #37ff9b;
        background: rgba(55, 255, 155, 0.16);
      }
      .tc-hub {
        position: absolute;
        left: 50%; top: 50%;
        width: 30%; height: 30%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(55, 255, 155, 0.3);
        border-radius: 50%;
      }
      .tc-right {
        position: absolute;
        right: calc(8px + env(safe-area-inset-right));
        bottom: calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .tc-act {
        pointer-events: auto;
        touch-action: none;
        width: 68px; height: 32px;
        border-radius: 8px;
        background: rgba(55, 255, 155, 0.1);
        border: 1px solid rgba(55, 255, 155, 0.5);
        color: #baffdd;
        font: inherit;
        font-size: 10px;
        letter-spacing: 1px;
      }
      .tc-act:active { background: rgba(55, 255, 155, 0.3); }
      .tc-look {
        pointer-events: auto;
        touch-action: none;
        position: relative;
        width: 112px; height: 112px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(2, 18, 10, 0.75), rgba(2, 18, 10, 0.86));
      }
      .tc-look-ring {
        position: absolute;
        inset: 12%;
        border: 1px solid rgba(55, 255, 155, 0.28);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(170, 255, 210, 0.4);
        font-size: 9px;
        letter-spacing: 2px;
      }
      .tc-look.aiming .tc-look-ring {
        border-color: rgba(55, 255, 155, 0.75);
        box-shadow: 0 0 12px rgba(55, 255, 155, 0.22);
        color: #37ff9b;
      }
      /* Дека на тапе: палитра встаёт НАД экранной клавиатурой, а не у низа
         дека под полем ввода как на десктопе (§15.2). */
      body.touch .hv-palette {
        bottom: calc(var(--kb) + env(safe-area-inset-bottom) + 10px);
        width: min(560px, 94%);
      }
      body.touch .hv-pal-input {
        font-size: 16px; /* <16px iOS зумит поле по фокусу */
      }
      body.touch .hv-pal-cand {
        padding: 10px 8px; /* тап-таргет ≥40px */
        cursor: pointer;
      }
      body.touch .hv-pal-cand:active { background: rgba(55, 255, 155, 0.25); }
      body.touch .hv-pal-hint { display: flex; justify-content: space-between; align-items: center; }
      .hv-pal-x {
        background: none;
        border: 1px solid rgba(55, 255, 155, 0.4);
        color: #baffdd;
        font: inherit;
        min-width: 40px; min-height: 40px;
        border-radius: 6px;
        cursor: pointer;
      }
      body.touch .hv-chip { padding: 9px 12px; } /* табы пальцем */
      body.touch .hv-btn { padding: 11px 12px; }
      /* Join/death-оверлеи на телефоне: скроллятся пальцем до ДЕПЛОЯ (§15.3) */
      body.touch .overlay {
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
        padding: 12px 8px;
      }
      /* Классы не влезают по ширине — идут вертикально в одну колонку (§15.3).
         Медиазапрос, не body.touch: решает ширина, телефон в ландшафте тоже
         попадает при <720px логической ширины. */
      @media (max-width: 720px) {
        .cards {
          grid-template-columns: 1fr;
        }
        .panel {
          padding: 16px 14px;
        }
        .logo {
          font-size: 28px;
          letter-spacing: 7px;
        }
      }
      /* Экран настроек под ДЕПЛОЕМ (ГДД §15.5). Десктоп: display:contents —
         ряд .chk рендерится ровно как раньше, слайдер/заголовок скрыты. */
      .joinSettings {
        display: contents;
      }
      .joinSettings .setHead,
      .joinSettings .setRow {
        display: none;
      }
      .joinSettings .tskl {
        display: none;
      }
      body.touch .joinSettings {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        order: 6; /* под ДЕПЛОЕМ (.panel на touch — flex-колонка) */
      }
      body.touch .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body.touch #deployBtn { order: 5; margin-top: 0; }
      body.touch #joinStatus { order: 7; }
      body.touch .teamSegWrap,
      body.touch #teamSeg { order: 4; }
      .setHead {
        font-size: 10px;
        letter-spacing: 3px;
        color: rgba(55, 255, 155, 0.6);
        border-top: 1px solid rgba(55, 255, 155, 0.18);
        padding-top: 10px;
        width: 100%;
      }
      .setRow {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .setLabel {
        font-size: 10px;
        letter-spacing: 1px;
        color: rgba(170, 255, 210, 0.7);
        white-space: nowrap;
      }
      .setVal {
        font-size: 11px;
        color: var(--cy);
        min-width: 38px;
        text-align: right;
      }
      #lookSens {
        flex: 1;
        accent-color: #37ff9b;
        height: 28px; /* зона пальца */
      }
      body.touch .joinSettings .setHead,
      body.touch .joinSettings .setRow {
        display: flex;
      }
      body.touch .setHead { display: block; }
      body.touch .joinSettings .dskl { display: none; }
      body.touch .joinSettings .tskl { display: inline; }
      body.touch .chk { font-size: 13px; }


      /* Mobile meatview HUD (ГДД §15.5): нижние углы эксклюзивны за tc-
         контролами — всё остальное ушло вверх; дебаг на телефоне не нужен;
         миникарта компактная в топ-леф; ростер — максимально компактно */
      body.touch #debug {
        display: none;
      }
      /* миникарта компактная в top-right (owner): топбар по центру не мешает,
         киллфид спустили под неё — углы не конфликтуют (§15.5) */
      body.touch #minimap {
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        left: auto;
        bottom: auto;
        width: 110px;
        height: 110px;
      }
      body.touch #topbar {
        top: calc(8px + env(safe-area-inset-top));
        padding: 5px 12px;
        gap: 10px;
      }
      body.touch #score0,
      body.touch #score1 {
        font-size: 15px;
        min-width: 20px;
      }
      body.touch #timer {
        font-size: 12px;
      }
      /* ростер: одна строка с обрезком — максимально компактно (§15.5) */
      body.touch .roster {
        font-size: 8px;
        letter-spacing: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-height: 1.2em;
        max-width: 130px;
      }
      /* HP-щит под топбаром по центру: левый низ занят крестиной */
      body.touch #vitals {
        left: 50%;
        transform: translateX(-50%);
        right: auto;
        bottom: auto;
        top: calc(62px + env(safe-area-inset-top));
        width: 150px;
        padding: 5px 8px;
      }
      body.touch #clsLabelRow {
        font-size: 9px;
        letter-spacing: 1px;
        margin-bottom: 4px;
      }
      body.touch #hpbar {
        height: 7px;
      }
      body.touch #killfeed {
        top: calc(124px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        max-width: 32vw;
        gap: 2px;
      }
      body.touch .kf {
        font-size: 9px;
        padding: 2px 6px;
        letter-spacing: 0;
      }
      /* тосты-подсказки: не гигантский пластырь по центру — компактно, над
          полосой контролов в мёртвой зоне между крестиной и прицелом */
      body.touch #jackinHint {
        top: auto;
        bottom: calc(132px + env(safe-area-inset-bottom));
        font-size: 11px;
        padding: 5px 12px;
        letter-spacing: 1px;
      }
      body.touch #propLabel {
        font-size: 9px;
        letter-spacing: 1px;
        top: calc(50% + 16px);
      }
      /* portrait-фолбэк (standalone iOS без ландшафта): миникарта ещё меньше */
      @media (orientation: portrait) {
        body.touch #minimap {
          width: 86px;
          height: 86px;
        }
        body.touch #killfeed {
          top: calc(100px + env(safe-area-inset-top));
        }
      }
      .hv-exit-btn {
        margin-left: auto;
        background: rgba(255, 77, 210, 0.12);
        border-color: rgba(255, 77, 210, 0.6);
        color: #ffb3dd;
        text-align: center;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div id="propLabel"></div>
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="dmg"></div>
    <div id="scope" class="hidden">
      <div class="ring"></div>
      <div class="h"></div>
      <div class="v"></div>
    </div>

    <div id="topbar">
      <div class="tcol">
        <span id="score0" class="t0">0</span>
        <div id="roster0" class="roster t0"></div>
      </div>
      <span id="timer">--:--</span>
      <div class="tcol">
        <span id="score1" class="t1">0</span>
        <div id="roster1" class="roster t1"></div>
      </div>
    </div>

    <div id="vitals">
      <div id="clsLabelRow"><span id="clsLabel">—</span><span id="weaponTag"></span><span id="hpNum">0</span></div>
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>

    <div id="killfeed"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="jackinHint" class="hidden"></div>

    <div id="hackview" class="hidden"></div>

    <div id="debug">
      <h1>HACKSTRIKE // M2</h1>
      <div class="row"><span class="dim">link</span><span id="status" class="status-connecting">CONNECTING…</span></div>
      <div class="row"><span class="dim">tick</span><span id="tick">—</span></div>
      <div class="row"><span class="dim">players</span><span id="players">—</span></div>
      <div class="row"><span class="dim">rtt</span><span id="rtt">—</span></div>
      <div class="row"><span class="dim">snaps/s</span><span id="snaps">—</span></div>
    </div>

    <div id="joinScreen" class="overlay">
      <div class="panel">
        <h1 class="logo">HACKSTRIKE</h1>
        <div class="tag">M2 // КИБЕР-БАЗИС</div>
        <div class="joinRow">
          <label for="nameInput">НИК</label>
          <input id="nameInput" maxlength="16" spellcheck="false" autocomplete="off" />
        </div>
        <div id="joinCards" class="cards"></div>
        <div class="joinRow seg" id="teamSeg">
          <button type="button" data-team="-1" class="segBtn on">АВТО</button>
          <button type="button" data-team="0" class="segBtn t0">ЗЕЛЁНЫЕ</button>
          <button type="button" data-team="1" class="segBtn t1">РОЗОВЫЕ</button>
        </div>
        <div id="joinSettings" class="joinSettings">
          <div class="setHead">НАСТРОЙКИ</div>
          <label class="chk"><input id="invertY" type="checkbox" /><span class="dskl">ИНВЕРСИЯ МЫШИ (Y)</span><span class="tskl">ИНВЕРСИЯ ВЗГЛЯДА</span></label>
          <div class="setRow" id="lookSensRow">
            <span class="setLabel">ЧУВСТВИТЕЛЬНОСТЬ</span>
            <input id="lookSens" type="range" min="30" max="300" step="10" value="100" />
            <span id="lookSensVal" class="setVal">1.0×</span>
          </div>
        </div>
        <button id="deployBtn" class="btn" disabled>ДЕПЛОЙ</button>
        <div id="joinStatus" class="dim">ЗАГРУЗКА КАРТЫ…</div>
      </div>
    </div>

    <div id="deathOverlay" class="overlay hidden">
      <div class="panel">
        <div id="deathTitle">УБИТ ▸ ???</div>
        <div id="deathCount">5</div>
        <div id="deathCards" class="cards hidden"></div>
        <button id="respawnBtn" class="btn hidden">РЕСПАУН [SPACE]</button>
      </div>
    </div>

    <div id="endOverlay" class="overlay hidden">
      <div class="panel">
        <div id="endTitle" class="end-title">МАТЧ ОКОНЧЕН</div>
        <div id="endScore">0 : 0</div>
        <div id="endCount">10</div>
        <div class="dim">АВТО-РЕСТАРТ</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
