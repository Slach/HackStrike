<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackStrike — skeleton</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050a06;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
      }
      #hud {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        background: rgba(0, 12, 4, 0.82);
        border: 1px solid rgba(0, 255, 128, 0.35);
        border-radius: 6px;
        color: #37ff9b;
        font-size: 13px;
        line-height: 1.7;
        min-width: 230px;
        pointer-events: none;
        text-shadow: 0 0 8px rgba(0, 255, 128, 0.45);
      }
      #hud h1 {
        margin: 0 0 6px 0;
        font-size: 13px;
        letter-spacing: 3px;
        font-weight: 700;
        color: #baffdd;
        border-bottom: 1px solid rgba(0, 255, 128, 0.25);
        padding-bottom: 6px;
      }
      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }
      #hud .dim {
        color: rgba(55, 255, 155, 0.55);
      }
      #status-open {
        color: #37ff9b;
      }
      #status-connecting {
        color: #ffd237;
      }
      #status-closed {
        color: #ff4d5e;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">
      <h1>HACKSTRIKE // SKELETON</h1>
      <div class="row"><span class="dim">link</span><span id="status" class="status-connecting">CONNECTING…</span></div>
      <div class="row"><span class="dim">tick</span><span id="tick">—</span></div>
      <div class="row"><span class="dim">players</span><span id="players">—</span></div>
      <div class="row"><span class="dim">rtt</span><span id="rtt">—</span></div>
      <div class="row"><span class="dim">snaps/s</span><span id="snaps">—</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
